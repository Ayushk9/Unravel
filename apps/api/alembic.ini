# Run alembic from this directory (apps/api):
#   ../../.venv/bin/python -m alembic upgrade head
# The database URL is NOT stored here. alembic/env.py reads DATABASE_URL from
# the same settings the application uses (environment or apps/api/.env).

[alembic]
script_location = %(here)s/alembic
# Puts apps/api on sys.path so env.py can import the `app` package.
prepend_sys_path = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
