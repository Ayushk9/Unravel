# Deadline rules for claims (Feature 6).
#
# Each rule says whether a person has checked it against its source
# (`verified`). The two Ombudsman rules were verified by Ayush on 2026-10-23
# against the Insurance Ombudsman Rules, 2017 (as amended till 09.11.2023),
# Rule 14(3). The others are a best understanding, `verified: false`. The API
# sends `verified` with every deadline and the app marks unverified ones.
#
# To verify a rule: read the source, correct `offset` and `source` if needed
# (fill in `url`), set `verified: true`, and raise `version` by one.
#
# Application code never contains a regulatory number. It reads them here.
#
# Fields of a rule
#   id           stable identifier, also used in the deadline's id
#   label        short title shown on the deadline card
#   trigger      what starts the clock:
#                  {admission: true}        the claim's admission date
#                  {event: <state>}         the latest event entering that state
#                  {event: <state>, otherwise: {event: <state>, after: {value, unit}}}
#                                           as above; if that event has not happened,
#                                           `after` past the latest `otherwise.event` (D-49)
#   active_in    claim states in which the deadline is shown
#   offset       how long after the trigger:
#                  {value: N, unit: days|months|years}
#                  {policy_field: intimation_deadline_hours}   read from the policy
#   description  one plain sentence for the user
#   source       where the rule comes from: document, section, url
#   verified     has a person checked this against the source?
#   version      raise when the rule's meaning or value changes

version: 1

# How many days before the due date a deadline changes urgency.
# A product choice, not a regulatory figure. Due today counts as critical.
urgency:
  critical_within_days: 3
  soon_within_days: 14

rules:
  - id: claim_intimation
    label: Claim intimation window
    trigger: {admission: true}
    active_in: [intimated, documents_submitted, under_review, queried, approved, denied, grievance_sent, insurer_replied, escalated, resolved]
    # Not a fixed number: each policy states its own window, and it is read
    # from that policy's extracted coverage profile. Never hardcoded.
    offset: {policy_field: intimation_deadline_hours}
    description: Your policy asks you to tell the insurer about a hospitalisation within a set time of admission.
    source:
      document: Your policy document
      section: Claim intimation clause (the page is linked from the policy's coverage profile)
      url: null
    verified: false   # TODO(Ayush): confirm the window counts from admission for both planned and emergency cases
    version: 1

  - id: insurer_decision
    label: Insurer should decide by
    trigger: {event: documents_submitted}
    active_in: [documents_submitted, under_review]
    # NOT VERIFIED (Ayush, 2026-10-23), being confirmed between two documents:
    #   - IRDAI/HLT/REG/CIR/152/06/2020: 30 days from the last necessary document
    #     (45 days if investigated), with interest at bank rate + 2% if late;
    #   - Master Circular on Protection of Policyholders' Interests, IRDAI/PP&GR/CIR/MISC/117/9/2024
    #     (5 Sep 2024): appears to set 15 days from submission of the claim for non-cashless health claims.
    # No value change until confirmed.
    offset: {value: 30, unit: days}
    description: An insurer is expected to settle or reject a claim within 30 days of receiving the last necessary document.
    source:
      document: "IRDAI circular IRDAI/HLT/REG/CIR/152/06/2020; IRDAI Master Circular on Protection of Policyholders' Interests, IRDAI/PP&GR/CIR/MISC/117/9/2024 (5 Sep 2024)"
      section: "Being confirmed: the 2020 circular says 30 days from the last necessary document (45 if investigated); the 2024 master circular appears to set 15 days from submission for non-cashless health claims"
      url: null   # TODO(Ayush): add the official URL once the governing document is confirmed
    verified: false
    version: 2

  - id: ombudsman_opens
    label: You may approach the Ombudsman from
    trigger: {event: grievance_sent}
    # Only while no reply is recorded: once the insurer replies, the claim leaves grievance_sent.
    active_in: [grievance_sent]
    offset: {value: 1, unit: months}
    description: >-
      If the insurer has not replied within one month of your written grievance, you may complain to the Insurance
      Ombudsman. This is counted from the date you sent the grievance; the Rules count from the insurer's receipt of it.
    source:
      document: Insurance Ombudsman Rules, 2017 (as amended till 09.11.2023)
      section: Rule 14(3)(a)
      url: "https://www.cioins.co.in/notification/Insurance%20Ombudsman%20Rules,%202017(%20as%20amended%20till%2009.11.2023).pdf"
    verified: true   # Ayush, 2026-10-23
    version: 2

  - id: ombudsman_filing
    label: Ombudsman filing window
    # Rule 14(3)(b): within one year of the insurer's reply (or rejection) of the written grievance; if the insurer did
    # not reply, within one year of the end of the month it had to reply in (Rule 14(3)(a)).
    trigger: {event: insurer_replied, otherwise: {event: grievance_sent, after: {value: 1, unit: months}}}
    active_in: [grievance_sent, insurer_replied]
    offset: {value: 1, unit: years}
    description: >-
      A complaint to the Insurance Ombudsman must be made within one year of the insurer's reply to your written
      grievance or, if it did not reply, within one year of the month after you sent it.
    source:
      document: Insurance Ombudsman Rules, 2017 (as amended till 09.11.2023)
      section: Rule 14(3)(a) and (b)
      url: "https://www.cioins.co.in/notification/Insurance%20Ombudsman%20Rules,%202017(%20as%20amended%20till%2009.11.2023).pdf"
    verified: true   # Ayush, 2026-10-23; trigger corrected under D-49
    version: 3
