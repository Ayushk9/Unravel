# Which rung of the escalation ladder a grievance letter can be drafted for,
# given the claim's current state (Feature 7, GET /claims/{id}/grievance-rungs).
#
# The insurer's grievance cell and the Ombudsman rungs follow Rule 14(3) of the
# Insurance Ombudsman Rules, 2017 (as amended till 09.11.2023), verified by Ayush
# on 2026-10-23 (D-49). Bima Bharosa is still `verified: false`. The API sends
# `verified` with every rung and the app marks unverified ones "based on an
# unverified rule". A rung is verified only if it AND every deadline it uses are.
#
# No number lives here. A date in a reason comes from a deadline rule in
# deadline_rules.yaml (named by `deadline`), which carries its own source and
# verified flag. A rung is verified only if it AND its deadline rule are.
#
# Fields of a rung
#   label         short name shown in the rung selector
#   addressee     who the letter is addressed to; {insurer} is the policy's
#                 insurer (the linked reference insurer, else the name the user
#                 entered), or "your insurer" when neither is recorded.
#                 Never an address, email or phone number.
#   when          the claim states in which the rung is offered, in order. Each has
#                   state      a claim state (app/claims/state_machine.py)
#                   reason     one sentence: why this rung fits now
#                   deadline   optional: the id of a deadline rule active in that state ({due})
#                   reason_after_due  optional: used instead of `reason` once that deadline has passed
#                   opens_with optional (D-49): the rung is offered only from this deadline's date ({opens});
#                              reason_before_open is shown until then. Enforced only if the rule is verified.
#                   closes_with optional (D-49): the rung is no longer offered after this deadline's date
#                              ({closes}); reason_after_close is shown then. Enforced only if the rule is verified.
#                 Placeholders: {event_date} (the date the claim entered `state`),
#                 {due} (the deadline's due date). A placeholder whose value is
#                 unknown makes the loader reject the file, never a guess.
#   not_offered   optional: per claim state, the sentence shown when the rung is not offered in that state
#   unavailable   the sentence shown when the claim is in none of the `when` states (and not in not_offered)
#   source        where the escalation step is described; url stays null until checked
#   verified      has a person checked this rung's sentences against the source?
#   version       raise when the meaning changes

version: 2

rungs:
  insurer_grievance_cell:
    label: Insurer's grievance cell
    # Never an address, email or phone number (tests/test_grievance_units.py checks).
    addressee: "Grievance Redressal Officer, {insurer}"
    when:
      - state: denied
        reason: Your claim was denied on {event_date}. A written grievance to the insurer comes first; the Insurance Ombudsman takes a complaint only after one.
      - state: grievance_sent
        reason: You sent your grievance on {event_date}. You can send the insurer's grievance cell a follow-up letter.
      - state: insurer_replied
        reason: The insurer replied to your grievance on {event_date}. You can write to its grievance cell again if the reply leaves questions unanswered.
      - state: documents_submitted
        deadline: insurer_decision
        reason: The insurer is expected to decide by {due}. You can write to its grievance cell about a delay, though it may be early to.
        reason_after_due: The date by which the insurer was expected to decide ({due}) has passed. You can write to its grievance cell about the delay.
      - state: under_review
        deadline: insurer_decision
        reason: The insurer is expected to decide by {due}. You can write to its grievance cell about a delay, though it may be early to.
        reason_after_due: The date by which the insurer was expected to decide ({due}) has passed. You can write to its grievance cell about the delay.
    unavailable: Available once the claim has been submitted to the insurer, or denied.
    source:
      document: Insurance Ombudsman Rules, 2017 (as amended till 09.11.2023)
      section: Rule 14(3)(a) (a written representation to the insurer comes before a complaint)
      url: "https://www.cioins.co.in/notification/Insurance%20Ombudsman%20Rules,%202017(%20as%20amended%20till%2009.11.2023).pdf"
    verified: true   # Ayush, 2026-10-23. The delay reasons use insurer_decision, which is not verified.
    version: 2

  irdai_bima_bharosa:
    label: IRDAI Bima Bharosa
    addressee: Insurance Regulatory and Development Authority of India (IRDAI), through the Bima Bharosa grievance portal
    when:
      - state: denied
        reason: Your claim was denied on {event_date}. Bima Bharosa usually expects you to have complained to the insurer's grievance cell first.
      - state: grievance_sent
        reason: You sent your grievance to the insurer on {event_date}. If it is not resolved, you can register it on Bima Bharosa.
      - state: insurer_replied
        reason: The insurer replied to your grievance on {event_date}. If you are not satisfied, you can register a grievance on Bima Bharosa.
    unavailable: Available once the claim has been denied, or you have written to the insurer's grievance cell.
    source:
      document: IRDAI Bima Bharosa (Integrated Grievance Management System)
      section: null
      url: null   # TODO(Ayush): add the official URL
    verified: false
    version: 1

  insurance_ombudsman:
    label: Insurance Ombudsman
    # No office address: which office covers a complainant, and its address, are unverified data.
    addressee: The Insurance Ombudsman (the office covering your area)
    when:
      - state: grievance_sent
        opens_with: ombudsman_opens
        closes_with: ombudsman_filing
        reason_before_open: You sent your grievance on {event_date}. If the insurer has not replied by {opens}, you may complain to the Insurance Ombudsman from that date.
        reason: You sent your grievance on {event_date} and no reply is recorded. You may complain to the Insurance Ombudsman until {closes}.
        reason_after_close: The window to complain to the Insurance Ombudsman ended on {closes}.
      - state: insurer_replied
        closes_with: ombudsman_filing
        reason: The insurer replied to your grievance on {event_date}. If its reply does not settle the matter, you may complain to the Insurance Ombudsman until {closes}.
        reason_after_close: The window to complain to the Insurance Ombudsman ended on {closes}, one year after the insurer's reply.
    not_offered:
      denied: The Insurance Ombudsman takes a complaint only after you have written to the insurer and it has rejected your grievance, replied unsatisfactorily, or not replied within one month. Write to the insurer's grievance cell first.
      escalated: You have already taken the complaint beyond the insurer.
    unavailable: Available once you have written to the insurer's grievance cell and it has replied, or has not replied within one month.
    source:
      document: Insurance Ombudsman Rules, 2017 (as amended till 09.11.2023)
      section: Rule 14(3)(a) and (b)
      url: "https://www.cioins.co.in/notification/Insurance%20Ombudsman%20Rules,%202017(%20as%20amended%20till%2009.11.2023).pdf"
    verified: true   # Ayush, 2026-10-23
    version: 2
