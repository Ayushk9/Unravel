# Ombudsman figures, each with its source and whether a person has checked it.
#
# award_ceiling: the largest amount the Insurance Ombudsman can award.
# VERIFIED by Ayush on 2026-10-23 against the official text: Rs 50 lakh,
# including relevant expenses (Insurance Ombudsman Rules, 2017, as amended
# till 09.11.2023, Rule 17(3) proviso (ii), substituted by G.S.R. 828(E)
# dated 9.11.2023).
#
# Where it may appear: ONLY in the Ombudsman rung's reason, worded as a limit
# on what the Ombudsman can award, never as a promise or an expected amount
# (`rung_sentence`). Never in a letter. tests/test_grievance_units.py checks both.
# If `verified` is ever set back to false, it disappears from every output.

version: 1

award_ceiling:
  value: 500000000   # integer paise: Rs 50,00,000
  verified: true
  # {ceiling} is the value above, formatted. Shown only while verified is true.
  rung_sentence: "By the Insurance Ombudsman Rules, the Ombudsman can award at most {ceiling}, including relevant expenses. This is a limit on what can be awarded, not an amount you can expect."
  source:
    document: Insurance Ombudsman Rules, 2017 (as amended till 09.11.2023)
    section: Rule 17(3), proviso (ii), substituted by G.S.R. 828(E) dated 9.11.2023
    url: "https://www.cioins.co.in/notification/Insurance%20Ombudsman%20Rules,%202017(%20as%20amended%20till%2009.11.2023).pdf"

# award_time: how long the Ombudsman takes to pass an award. Information only, never a deadline
# (the clock starts when the Ombudsman has all requirements, a date the app cannot know).
# VERIFIED by Ayush on 2026-10-23: Rule 17(4), same document. Shown in the Ombudsman rung once
# a complaint has been filed (claim state `escalated`).
award_time:
  verified: true
  sentence: "By Rule 17(4) of the Insurance Ombudsman Rules, the Ombudsman is to pass an award within three months of receiving all the requirements from you. This is information, not a date the app can work out."
  source:
    document: Insurance Ombudsman Rules, 2017 (as amended till 09.11.2023)
    section: Rule 17(4)
    url: "https://www.cioins.co.in/notification/Insurance%20Ombudsman%20Rules,%202017(%20as%20amended%20till%2009.11.2023).pdf"
